  server_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - run: mkdir run && echo "eula=true" >> run/eula.txt
      - run: ./gradlew runGametest --stacktrace --warning-mode=fail

  release:
    needs:
      - build
      - server_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v5
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v5
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace --no-configuration-cache
      - name: Publish to Github Packages
        run: ./gradlew publish -x check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'com.github.salandora.sophisticatedfabriclib'
          package-type: 'maven'
          min-versions-to-keep: 10
      - name: PublishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          if [[ "$BRANCH_NAME" =~ ^[0-9]+\.[0-9]+\.([0-9]+|x)-fabric$ ]]; then
            ./gradlew publishMods -x check
          
            mod_version=$(grep -E '^mod_version[[:space:]]*=' gradle.properties | sed 's/.*=[[:space:]]*//')
            minecraft_version=$(grep -E '^minecraft_version[[:space:]]*=' gradle.properties | sed 's/.*=[[:space:]]*//')
            tag_name="${mod_version}+${minecraft_version}"

            if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
              echo "Tag ${tag_name} already exists. Skipping tag creation."
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "${tag_name}" -m "Release ${tag_name}"
              git push origin "refs/tags/${tag_name}"
            fi
          else
            echo "Branch name does not match the pattern: $BRANCH_NAME. Skipping upload."
            exit 0
          fi
